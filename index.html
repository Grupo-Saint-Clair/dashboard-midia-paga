<title>Investimento em Mídia Paga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #080d19; --panel: rgba(19,27,47,.78); --line: rgba(150,168,205,.18); --fg: #eaf0fb; --muted: #8d99b5; --meta: #7088ff; --google: #1fc8a6; --bad: #ff6b7d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: "Manrope", "Segoe UI", system-ui, sans-serif; display: grid; place-items: center; padding: 16px; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: radial-gradient(50rem 34rem at 10% -10%, rgba(112,136,255,.22), transparent 60%), radial-gradient(44rem 30rem at 110% 110%, rgba(31,200,166,.16), transparent 60%), var(--bg); }
  form { width: min(100%, 400px); background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 34px 30px; display: flex; flex-direction: column; gap: 16px; backdrop-filter: blur(14px); box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: "Sora", "Segoe UI", sans-serif; font-weight: 600; font-size: 26px; margin: 0; letter-spacing: -.02em; }
  p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  label { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
  input[type=password] { font: 600 16px "Manrope", sans-serif; color: var(--fg); background: rgba(8,13,25,.6); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; outline: none; }
  input[type=password]:focus { border-color: var(--meta); box-shadow: 0 0 0 3px rgba(112,136,255,.25); }
  .lembrar { flex-direction: row; align-items: center; gap: 10px; cursor: pointer; }
  button { font: 700 15px "Manrope", sans-serif; color: #0a0f1c; background: linear-gradient(135deg, #f3f6ff, #c9d4ff); border: 0; border-radius: 12px; padding: 14px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  button:focus-visible { outline: 2px solid var(--meta); outline-offset: 3px; }
  .erro { color: var(--bad); font-size: 13px; min-height: 18px; }
</style>
</head>

const CHAVE_LOCAL = 'dash-midia-paga:' + SAL;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function derivar(senha) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(SAL), iterations: ITER, hash: 'SHA-256' }, base, 256));
}
async function abrir(bruta) {
  const chave = await crypto.subtle.importKey('raw', bruta, 'AES-GCM', false, ['decrypt']);
  const zip = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(IV) }, chave, b64(DADOS));
  const html = await new Response(new Blob([zip]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
}
const f = document.getElementById('f'), e = document.getElementById('e'), b = document.getElementById('b');
f.addEventListener('submit', async ev => {
  ev.preventDefault(); e.textContent = ''; b.disabled = true; b.textContent = 'Abrindo…';
  try {
    const bruta = await derivar(document.getElementById('s').value);
    if (document.getElementById('r').checked) { try { localStorage.setItem(CHAVE_LOCAL, btoa(String.fromCharCode(...bruta))); } catch (x) {} }
    await abrir(bruta);
  } catch (x) {
    e.textContent = 'Senha incorreta. Confira e tente de novo.'; b.disabled = false; b.textContent = 'Abrir painel';
  }
});
(async () => {
  let salva = null; try { salva = localStorage.getItem(CHAVE_LOCAL); } catch (x) {}
  if (salva) { try { await abrir(b64(salva)); } catch (x) { try { localStorage.removeItem(CHAVE_LOCAL); } catch (y) {} } }
})();
